# All nodes share the "net" service's network namespace, so members and the host use the
# same addresses (127.0.0.1:<port>). "net" also writes the shared keyfile.
name: oworail-p5-rs

x-node: &node
  image: mongo:7.0
  network_mode: "service:net"
  depends_on: [net]
  volumes:
    - keys:/keys:ro
  restart: "no"

services:
  net:
    image: mongo:7.0
    command:
      - bash
      - -c
      - |
        head -c 756 /dev/urandom | base64 -w 0 > /keys/keyfile
        chmod 400 /keys/keyfile
        chown 999:999 /keys/keyfile
        exec sleep infinity
    ports:
      - "127.0.0.1:27021:27021"
      - "127.0.0.1:27022:27022"
      - "127.0.0.1:27023:27023"
    volumes:
      - keys:/keys

  mongo1:
    <<: *node
    command: &start
      - bash
      - -c
      - |
        until [ -s /keys/keyfile ]; do sleep 1; done
        exec gosu mongodb mongod --replSet rs5 --port $$PORT --bind_ip_all --keyFile /keys/keyfile --wiredTigerCacheSizeGB 0.25 --dbpath /data/db
    environment: {PORT: "27021"}
    volumes: [keys:/keys:ro, rs1:/data/db]

  mongo2:
    <<: *node
    command: *start
    environment: {PORT: "27022"}
    volumes: [keys:/keys:ro, rs2:/data/db]

  mongo3:
    <<: *node
    command: *start
    environment: {PORT: "27023"}
    volumes: [keys:/keys:ro, rs3:/data/db]

volumes:
  keys:
  rs1:
  rs2:
  rs3:
